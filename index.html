<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Starlen Angel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Caveat:wght@500;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fbeff0;--bg2:#efe6f7;--card:#fffaf1;--ink:#4a3038;--soft:#8a6a72;--rose:#e2607f;--edge:#8a5a3c;--paper:#f6e6c6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1c26;--bg2:#241d33;--card:#3a2a34;--ink:#fbe9ee;--soft:#d3aebb;--paper:#5a4438}}
:root[data-theme="dark"]{--bg1:#2a1c26;--bg2:#241d33;--card:#3a2a34;--ink:#fbe9ee;--soft:#d3aebb;--paper:#5a4438}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));background-color:var(--bg1);color:var(--ink);font-family:Quicksand,system-ui,sans-serif;overflow:hidden;position:relative}
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;bottom:-10%;opacity:.55;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(360deg)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;text-align:center;opacity:0;visibility:hidden;transition:opacity .8s,visibility .8s;overflow-y:auto}
.screen.on{opacity:1;visibility:visible}
.tag{font-size:12px;color:var(--soft);letter-spacing:.06em;margin-bottom:10px}
h1,h2{font-family:"Cormorant Garamond",serif;font-weight:700}
.script{font-family:Caveat,cursive;color:var(--rose);font-weight:700}
.card{background:var(--card);border-radius:22px;padding:28px 24px;width:min(420px,100%);box-shadow:0 18px 50px rgba(200,120,150,.25);position:relative}
.btn{margin-top:20px;border:0;border-radius:99px;background:var(--rose);color:#fff;font:600 13px Quicksand,sans-serif;padding:12px 24px;cursor:pointer;box-shadow:0 8px 20px rgba(226,96,127,.4);transition:transform .2s}
.btn:hover{transform:translateY(-2px) scale(1.04)}
.btn:focus-visible,.pick:focus-visible,.nav:focus-visible,#play:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
/* envelope */
#s1 h2{font-size:clamp(28px,7vw,38px)}
#s1 .script{font-size:26px}
.env{position:relative;width:240px;height:160px;margin:38px 0 10px;cursor:pointer;animation:bob 3s ease-in-out infinite;background:none;border:0}
.env.open{animation:none}
@keyframes bob{50%{transform:translateY(-10px)}}
.env .body{position:absolute;inset:0;background:#f7e3bd;border:3px solid var(--edge);border-radius:8px;z-index:3;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%)}
.env .back{position:absolute;inset:0;background:#e8cf9f;border:3px solid var(--edge);border-radius:8px;z-index:1}
.env .flap{position:absolute;left:0;right:0;top:0;height:82px;background:#f2d9a8;border:3px solid var(--edge);border-radius:8px 8px 0 0;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease,z-index 0s .35s;z-index:4}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.env .heart{position:absolute;left:50%;top:44px;transform:translateX(-50%);z-index:5;font-size:22px;transition:opacity .3s}
.env.open .heart{opacity:0}
.env .note{position:absolute;left:14px;right:14px;top:10px;height:130px;background:var(--card);border-radius:6px;z-index:2;transition:transform .8s .5s ease}
.env.open .note{transform:translateY(-80px)}
.hint{font-size:13px;color:var(--soft);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
/* card */
.avatar{width:64px;height:64px;border-radius:50%;background:#ffd6e0;display:grid;place-items:center;font-size:34px;margin:-58px auto 10px;box-shadow:0 6px 16px rgba(226,96,127,.35);border:3px solid var(--card)}
.name{font-family:"Cormorant Garamond",serif;font-size:clamp(34px,10vw,46px);line-height:1}
.name span{display:inline-block;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{50%{transform:translateY(-6px)}}
.date{font-size:13px;color:var(--soft);margin:8px 0 14px}
.card p{font-size:14px;line-height:1.7;color:var(--soft)}
.player{display:flex;align-items:center;gap:12px;margin-top:18px;padding:10px 14px;border-radius:14px;background:rgba(226,96,127,.1);text-align:left}
#play{width:40px;height:40px;border-radius:50%;border:0;background:var(--rose);color:#fff;font-size:14px;cursor:pointer;flex:none}
.bar{height:5px;border-radius:9px;background:rgba(226,96,127,.25);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--rose)}
.player b{font:700 13px Quicksand;display:block}
.player small{color:var(--soft);font-size:11px}
/* album */
.stage{display:flex;align-items:center;gap:8px;width:min(480px,100%)}
.nav{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--card);color:var(--rose);font-size:16px;cursor:pointer;box-shadow:0 4px 12px rgba(200,120,150,.3)}
.slide{flex:1;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:pop .6s}
@keyframes pop{from{opacity:0;transform:translateX(30px) rotate(3deg)}}
.pic{font-size:88px;width:200px;height:200px;border-radius:14px;background:linear-gradient(135deg,#ffe3ea,#e8dcf8);display:grid;place-items:center;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.08);animation:bob 4s ease-in-out infinite}
.pic img{width:100%;height:100%;object-fit:cover}
.cap{font-family:Caveat,cursive;font-size:22px;line-height:1.15;font-weight:700}
.dots{display:flex;gap:7px;margin-top:14px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--rose);opacity:.3;transition:.3s}
.dots i.a{opacity:1;transform:scale(1.4)}
/* bouquet */
.wishes{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;max-width:420px;margin:26px 0 6px}
.pick{border:0;background:none;font-size:52px;cursor:pointer;transform-origin:bottom;animation:sway 3s ease-in-out infinite;transition:filter .3s}
.pick:nth-child(2n){animation-delay:-1s}.pick:nth-child(3n){animation-delay:-2s}
@keyframes sway{50%{transform:rotate(7deg)}}
.pick.done{filter:grayscale(.7) opacity(.5)}
.basket{font-size:60px;margin-top:-6px}
#modal{position:fixed;inset:0;background:rgba(74,48,56,.45);display:grid;place-items:center;padding:24px;opacity:0;visibility:hidden;transition:.4s;z-index:20}
#modal.on{opacity:1;visibility:visible}
#modal .card{transform:scale(.7) rotate(-4deg);transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
#modal.on .card{transform:none}
#wtext{font-family:Caveat,cursive;font-size:24px;font-weight:700;line-height:1.3;color:var(--ink)}
/* letter */
.letter{text-align:left;max-height:82vh;overflow-y:auto}
.letter h2{font-size:34px;text-align:center;margin-bottom:14px}
.letter p{margin-bottom:12px;font-size:14.5px}
.sign{font-family:Caveat,cursive;font-size:26px;color:var(--rose);margin-top:14px;text-align:right}
.rv{opacity:0;transform:translateY(12px);transition:.9s}
.on .rv{opacity:1;transform:none}
.on .rv:nth-child(2){transition-delay:.4s}.on .rv:nth-child(3){transition-delay:1.2s}.on .rv:nth-child(4){transition-delay:2s}.on .rv:nth-child(5){transition-delay:2.8s}.on .rv:nth-child(6){transition-delay:3.6s}
canvas{position:fixed;inset:0;pointer-events:none;z-index:30}

.screen{transform:translateY(26px) scale(.97);transition:opacity .9s,visibility .9s,transform 1s cubic-bezier(.2,.9,.3,1)}.screen.on{transform:none}
.avatar{width:86px;height:86px;margin:-66px auto 12px;font-size:0;background-size:cover;background-position:center;border:4px solid var(--card);box-shadow:0 10px 26px rgba(226,96,127,.4);animation:bob 4s ease-in-out infinite;position:relative;display:block}
.avatar::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--rose);opacity:0;animation:ring 2.6s ease-out infinite}
@keyframes ring{from{transform:scale(.85);opacity:.7}to{transform:scale(1.3);opacity:0}}
.hang{position:absolute;top:0;left:50%;margin-left:-30px;width:60px;display:flex;flex-direction:column;align-items:center;transform-origin:top center;animation:swing 4s ease-in-out infinite;z-index:2}
.hang i{width:2px;height:46px;background:#b98a5a}.hang img{width:54px;height:54px;filter:drop-shadow(0 6px 8px rgba(20,40,120,.3))}
@keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.st{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px rgba(255,255,255,.9);animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.5)}}
.sp{position:fixed;pointer-events:none;z-index:40;font-size:15px;animation:spk .9s forwards}
@keyframes spk{to{opacity:0;transform:translate(var(--dx),-34px) scale(.4)}}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px;margin-top:6px}.eq i{width:3px;height:3px;border-radius:2px;background:var(--rose)}
.playing .eq i{animation:eqb .55s ease-in-out infinite alternate}.eq i:nth-child(2){animation-delay:.15s!important}.eq i:nth-child(3){animation-delay:.3s!important}.eq i:nth-child(4){animation-delay:.08s!important}
@keyframes eqb{to{height:16px}}
#s4.on .pick{animation:bloom .9s cubic-bezier(.3,1.6,.5,1) both,sway 3s ease-in-out .9s infinite;animation-delay:calc(var(--i)*.15s),calc(.9s + var(--i)*.15s)}
@keyframes bloom{from{transform:scale(0) rotate(-120deg);opacity:0}}
.w{display:inline-block;opacity:0}.on .w{animation:wi .7s both}
@keyframes wi{from{opacity:0;transform:translateY(8px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.date{animation:pulse 3s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fl{display:none}}
#lock{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--bg1),var(--bg2));transition:opacity .9s,visibility .9s}
#lock.gone{opacity:0;visibility:hidden}
#lock .card{text-align:center}
#lock .ic{font-size:44px;animation:bob 3s ease-in-out infinite}
#lock h2{font-size:30px;margin:8px 0 6px}
.pwrow{display:flex;gap:8px;margin-top:18px}
#pw{flex:1;min-width:0;border:2px solid rgba(226,96,127,.35);border-radius:14px;background:transparent;color:var(--ink);font:500 15px Quicksand,sans-serif;padding:12px 14px}
#pw:focus{outline:none;border-color:var(--rose)}
#eye{border:0;background:rgba(226,96,127,.12);border-radius:14px;width:46px;font-size:18px;cursor:pointer}
#msg{min-height:20px;font-size:13px;color:var(--rose);margin-top:12px}
.shake{animation:shk .45s}
@keyframes shk{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

/* designer credit */
#designer-credit{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:100;display:flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid rgba(226,96,127,.45);border-radius:999px;background:rgba(255,250,241,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);font:600 10px Quicksand,sans-serif;letter-spacing:.06em;box-shadow:0 0 18px rgba(226,96,127,.28),0 6px 18px rgba(74,48,56,.12);animation:creditGlow 2.8s ease-in-out infinite;white-space:nowrap}
#designer-credit b{font-size:12px;color:var(--rose);text-shadow:0 0 9px rgba(226,96,127,.35)}
#designer-credit span{opacity:.7}
@keyframes creditGlow{50%{box-shadow:0 0 26px rgba(226,96,127,.42),0 8px 22px rgba(74,48,56,.14);transform:translateY(-1px)}}
@media (max-width:420px){#designer-credit{right:9px;padding:6px 9px;font-size:9px}#designer-credit b{font-size:11px}}
@media (prefers-color-scheme:dark){#designer-credit{background:rgba(58,42,52,.72);border-color:rgba(255,210,225,.3)}}
:root[data-theme="dark"] #designer-credit{background:rgba(58,42,52,.72);border-color:rgba(255,210,225,.3)}
</style>
</head>

const $l=s=>document.querySelector(s);let fails=0,until=0,busy=false;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(pw){const d=b64(PAYLOAD),salt=d.slice(0,16),iv=d.slice(16,28),ct=d.slice(28);
 const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:600000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct)))}
$l("#eye").onclick=()=>{const p=$l("#pw");p.type=p.type=="password"?"text":"password"};
async function tryUnlock(){if(busy)return;const m=$l("#msg"),now=Date.now();
 if(now<until){m.textContent="Too many tries. Wait "+Math.ceil((until-now)/1000)+"s.";return}
 const v=$l("#pw").value;if(!v){m.textContent="Type the password first.";return}
 busy=true;m.textContent="Checking…";
 try{const o=await dec(v);$l("#app").innerHTML=o.html;const s=document.createElement("script");s.textContent=o.js;document.body.appendChild(s);$l("#lock").classList.add("gone");setTimeout(()=>$l("#lock").remove(),1000)}
 catch(e){fails++;const c=$l("#lc");c.classList.remove("shake");c.offsetWidth;c.classList.add("shake");
  if(fails>=3){const w=Math.min(15*Math.pow(2,fails-3),600);until=Date.now()+w*1000;m.textContent="Wrong password. Locked for "+w+"s."}
  else m.textContent="That's not it. Try again ("+(3-fails)+" left before a pause).";$l("#pw").value=""}
 busy=false}
$l("#ub").onclick=tryUnlock;$l("#pw").addEventListener("keydown",e=>{if(e.key=="Enter")tryUnlock()});
